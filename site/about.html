<p class="h3p">أثر يدير استبانات موجهة لخمس فئات، ويحوّل نتائجها إلى دراسة إلكترونية بتقرير وتوصيات تساعد الإدارة على اتخاذ قرارات تطوير مبنية على آراء أصحاب العلاقة، دون أن يكرر بيانات النواة أو يعدّل فيها.</p>

<section class="sct"><h2>ما الذي يقدمه</h2><div class="grid">

<div class="card"><b>روابط عامة</b><p>يعبّئ المتعلم وولي الأمر والجهة المشرفة برابط بلا حساب، والاسم والبريد والجوال اختيارية.</p></div>
<div class="card"><b>دراسة وتقرير وتوصيات</b><p>بعد الإغلاق تُنشأ الدراسة بالمتوسطات حسب المحور ونقاط القوة وفرص التحسين وتوصيات مرتبة بالأولوية، وتُراجَع وتُعتمد ثم تُطبع.</p></div>
<div class="card"><b>الأدوار والصلاحيات</b><p>مدير النواة ومنسق أثر بكل الصلاحيات، ومدير المدرسة بصلاحيات عمل، والمنسوب يعبّئ استباناته ويرى دراساته المعتمدة.</p></div></div></section>
