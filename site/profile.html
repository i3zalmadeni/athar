<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>الملف الشخصي – أثر</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet"><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="assets/core.css"><link rel="stylesheet" href="assets/athar.css"></head>
<body><div id="hdr"></div><main class="wrap" id="app"><div class="empty"><span class="spin"></span></div></main><div id="ftr"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><script src="assets/config.js"></script><script src="assets/app.js"></script>
<script>
(async () => { if (!(await A.guard("profile.html"))) return; const me = A.state.me, { esc, rpc, $, fmt } = A, p = me.profile || {};
const act = me.status === "active"; let prefs = {}, acts = [];
if (act) { try { prefs = await rpc("notif_prefs"); acts = await rpc("my_activity", { p_limit: 15 }); } catch (_) {} }
const KIND = { account: "حالة الحساب (إلزامي)", link: "ربط أولياء الأمور", system: "تحديثات مهمة" }, AC = { login: "تسجيل دخول", "profile.update": "تحديث الملف الشخصي" };
$("#app").innerHTML = `${A.statusScreen(me)}
<div class="card"><div class="fg"><div><small class="hint">الاسم</small><div><b>${esc(me.display_name)}</b></div></div><div><small class="hint">معرّف الدخول</small><div dir="ltr" style="text-align:right">${esc(me.login_id)}</div></div>
<div><small class="hint">الحالة</small><div>${A.badge(me.status)}</div></div><div><small class="hint">الأدوار</small><div>${me.roles.map(r => esc(r.name_ar)).join("، ")}</div></div>
<div><small class="hint">آخر دخول</small><div>${fmt(me.last_login_at)}</div></div><div><small class="hint">تاريخ الإنشاء</small><div>${fmt(me.created_at)}</div></div></div>
<p class="hint">الاسم والبيانات الأساسية لا تُعدَّل من هنا. الاسم ومعرّف الدخول مصدرهما حساب النواة الرقمية.</p></div>
${act ? `<h3 class="sec">وسائل التواصل</h3><form class="card" id="pf"><div class="fg"><div><label for="ph">رقم الجوال</label><input id="ph" dir="ltr" value="${esc(p.phone || "")}" pattern="[0-9+ ]{7,20}"></div>
<div class="full"><label for="bio">نبذة</label><textarea id="bio" maxlength="500">${esc(p.bio || "")}</textarea></div></div><p class="err" id="pm"></p><button class="btn">حفظ</button></form>
<h3 class="sec">إعدادات الإشعارات</h3><div class="card">${Object.entries(KIND).map(([k, t]) => `<label style="display:flex;gap:8px;align-items:center;margin:6px 0"><input type="checkbox" style="width:auto" data-k="${k}" ${prefs[k] !== false ? "checked" : ""} ${k === "account" ? "disabled" : ""}>${t}</label>`).join("")}</div>
<h3 class="sec">سجل نشاطي</h3><div class="card">${acts.length ? acts.map(a => `<div class="row2"><span>${esc(AC[a.action] || a.action)}</span><small class="hint">${fmt(a.created_at)}</small></div>`).join("") : '<div class="empty">لا يوجد نشاط.</div>'}</div>` : ""}`;
const pf = $("#pf"); if (pf) pf.onsubmit = async (e) => { e.preventDefault(); try { await rpc("update_profile", { p_phone: $("#ph").value, p_bio: $("#bio").value, p_contact: p.contact_methods || [] }); A.toast("تم الحفظ"); } catch (x) { $("#pm").textContent = A.msg(x); } };
document.querySelectorAll("[data-k]").forEach(c => c.onchange = async () => { try { await rpc("set_notif_pref", { p_kind: c.dataset.k, p_enabled: c.checked }); } catch (x) { c.checked = !c.checked; A.toast(A.msg(x), true); } });
})();
</script></body></html>
