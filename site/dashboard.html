<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>مكتبي الإلكتروني – أثر</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet"><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="assets/core.css"><link rel="stylesheet" href="assets/athar.css"></head>
<body><div id="hdr"></div><main class="wrap" id="app"><div class="empty"><span class="spin"></span></div></main><div id="ftr"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><script src="assets/config.js"></script><script src="assets/ub.js"></script><script src="assets/role-switch.js"></script><script src="assets/unified-kit.js"></script><script src="assets/app.js"></script>
<script>
(async () => { if (!(await A.guard("dashboard.html"))) return; const me = A.state.me, { esc, rpc, $, fmt, ico } = A;
const codes = me.roles.map((r) => r.code);
const role = codes.includes("admin") ? "مدير النواة الرقمية" : codes.includes("athar_coordinator") ? "منسق أثر" : codes.includes("school_manager") ? "مدير المدرسة" : "منسوب";
if (window.PK) PK.welcome("#app", { mode: "before", sb: A.sb, name: me.display_name, role });
if (me.status !== "active") { $("#app").innerHTML = A.statusScreen(me); return; }
let S = { pending: [], participated: [] }, d = {};
try { S = await rpc("surveys_me"); } catch (_) {} try { d = await rpc("admin_dashboard"); } catch (_) {}
const due = (x) => x.closes_at ? `<small class="hint">آخر موعد ${fmt(x.closes_at)}</small>` : "";
const pend = S.pending.length ? S.pending.map((x) => `<div class="sv ${x.required ? "req" : ""}"><div class="row2"><b>${esc(x.title)}</b>${x.required ? '<span class="badge warn">مطلوبة منك</span>' : '<span class="badge info">اختيارية</span>'}</div>
  ${x.description ? `<p>${esc(x.description)}</p>` : ""}<div class="row2"><span class="hint">${x.questions} أسئلة ${due(x)}</span><a class="btn sm" href="survey.html?id=${x.id}">تعبئة الاستبانة</a></div></div>`).join("")
  : '<div class="empty">لا توجد استبانات تنتظرك الآن.</div>';
const part = S.participated.length ? S.participated.map((x) => `<div class="sv"><div class="row2"><b>${esc(x.title)}</b>${x.study_ready ? '<span class="badge ok">الدراسة معتمدة</span>' : '<span class="badge">بانتظار الدراسة</span>'}</div>
  <div class="row2"><span class="hint">شاركت ${fmt(x.submitted_at)}</span>${x.study_ready ? `<a class="btn sm sec" href="study.html?id=${x.study_id}">الدراسة والتوصيات</a>` : ""}</div></div>`).join("")
  : '<div class="empty">لم تشارك في دراسات بعد. تظهر هنا الاستبانات التي تعبّئها، ثم دراستها وتوصياتها بعد اعتمادها.</div>';
const go = (h, l, v, tone) => `<a href="${h}"><span>${l}</span><b class="${tone && +v ? tone : ""}">${v ?? "—"}</b></a>`;
const win = (h, i, t, dsc, rows) => `<section class="card fbw"><a class="fbw-h" href="${h}"><span class="pb-ic">${ico(i)}</span><span><b>${t}</b><small>${dsc}</small></span><span class="fbw-go">فتح ‹</span></a><div class="fbw-r">${rows.join("")}</div></section>`;
if (me.rv_coord) {   // «نظرة عامة» لمنسق أثر: نافذة لكل قسم بأعداده، تفتحه
  const sm = A.can("surveys:manage");
  $("#app").innerHTML = `<div class="fbws">${sm ? win("surveys-admin.html", "edit", "الاستبانات", "إنشاء الاستبانات ونشرها وإغلاقها", [go("surveys-admin.html", "مفتوحة", d.open_surveys), go("surveys-admin.html", "مسودة", d.draft_surveys, "warn"), go("surveys-admin.html", "إجمالي الاستجابات", d.responses)])
      + win("studies-admin.html", "chart", "الدراسات", "نتائج الاستبانات والتقارير والتوصيات", [go("studies-admin.html", "بانتظار الاعتماد", d.studies_pending, "warn")]) : ""}
    ${win("admin.html#settings", "gear", "إدارة البوابة", "الإعدادات والتكامل، والإعلانات", [go("admin.html#settings", "حسابات المنسوبين الفعّالة", d.staff_accounts), go("admin.html#audit", "سجل العمليات", "فتح")])}</div>`;
} else $("#app").innerHTML = `<div class="two"><section><h3 class="sec">استبانات تنتظرك</h3>${pend}</section><section><h3 class="sec">دراسات شاركت بها</h3>${part}</section></div>`; })();
</script><script src="https://i3zalmadeni.github.io/digital-core/assets/report-kit.js?v=20261120a"></script><script>window.ReportKit&&ReportKit.install({system:"athar",systemName:"أثر",root:["#app","#main","main"]});</script></body></html>
