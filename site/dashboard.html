<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة التحكم – أثر</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/athar.css"></head>
<body><div id="hdr"></div><main class="wrap" id="app"><div class="empty"><span class="spin"></span></div></main><div id="ftr"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><script src="assets/config.js"></script><script src="assets/app.js"></script>
<script>
(async () => { if (!(await A.guard("dashboard"))) return; const me = A.state.me, { esc, rpc, $, fmt } = A;
const head = `<section class="hero"><h1>مرحباً، ${esc(me.display_name)}</h1><p>${me.roles.map(r => esc(r.name_ar)).join("، ")}</p></section>`;
if (me.status !== "active") { $("#app").innerHTML = head + A.statusScreen(me); return; }
let d = {}; try { d = await rpc("admin_dashboard"); } catch (_) {}
const cards = [["pending_links","طلبات ربط أولياء الأمور","admin.html#links"],["pending_students","طلاب بانتظار التحقق","admin.html#students"],["active_intake_links","روابط تعبئة فعّالة","admin.html#intake"],["staff_accounts","حسابات المنسوبين الفعّالة","admin.html#accounts"]].filter(([k]) => d[k] != null);
$("#app").innerHTML = head + (cards.length ? `<h3 class="sec">نظرة سريعة</h3><div class="grid">${cards.map(([k,t,h]) => `<a class="stat" href="${h}" style="text-decoration:none"><b>${d[k]}</b><span>${t}</span></a>`).join("")}</div>` : '<div class="card">لا توجد مهام إدارية مرتبطة بصلاحياتك.</div>')
 + `<h3 class="sec">ارتباطك بالنواة الرقمية</h3><div class="card">${me.staff_link ? `حسابك موحّد مع النواة الرقمية، وجرى التحقق منه ${fmt(me.staff_link.verified_at)}.` : "غير مرتبط"}</div>`; })();
</script></body></html>
