<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>الدراسة – أثر</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet"><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="assets/core.css"><link rel="stylesheet" href="assets/athar.css"></head>
<body><div id="hdr"></div><main class="wrap" id="app"><div class="empty"><span class="spin"></span></div></main><div id="ftr"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><script src="assets/config.js"></script><script src="assets/ub.js"></script><script src="assets/unified-kit.js"></script><script src="assets/app.js"></script>
<script>
(async () => { if (!(await A.guard("study.html"))) return; const { esc, rpc, $, fmt, msg } = A;
const AUD = { student: "المتعلم", teacher: "المعلم", administrative: "الهيئة الإدارية", supervisor: "الجهة المشرفة", parent: "ولي الأمر" };
const id = new URLSearchParams(location.search).get("id");
let r; try { r = await rpc("study_get", { p_id: id }); } catch (x) { $("#app").innerHTML = `<div class="alert bad">${esc(msg(x))}</div><p><a class="btn sec" href="dashboard.html">العودة إلى مكتبي الإلكتروني</a></p>`; return; }
const sn = r.snapshot, sv = sn.survey, bar = (l, v, t) => `<div class="r"><span>${esc(l)}</span><span class="t"><i style="width:${Math.min(100, v)}%"></i></span><b>${t}</b></div>`;
const item = (x, i) => `<div class="qcard"><h4>${i + 1}. ${esc(x.prompt)}</h4>` + (x.kind === "scale"
  ? `<p class="hint">المتوسط <b>${x.mean ?? "—"}</b> من 4 · موافقون ${x.favorable_pct ?? 0}% · غير موافقين ${x.unfavorable_pct ?? 0}% · أجاب ${x.answered}</p><div class="bars">${x.dist.map((c, k) => bar((x.options && x.options[k]) || String(k + 1), x.answered ? (100 * c / x.answered) : 0, c)).join("")}</div>`
  : x.kind === "choice" ? `<div class="bars">${(x.options || []).map((o) => bar(o.label, o.pct, `${o.count} (${o.pct}%)`)).join("")}</div>`
  : `<p class="hint">${x.answered} إجابة نصية، لا تُعرض في تقرير الدراسة حمايةً للخصوصية.</p>`) + "</div>";
const list = (a, f) => a.length ? `<ul>${a.map(f).join("")}</ul>` : '<p class="hint">لا يوجد.</p>';
$("#app").innerHTML = `<div class="row2"><h2>${esc(sv.title)}</h2><span class="badge ${r.status === "approved" ? "ok" : "warn"}">${r.status === "approved" ? "دراسة معتمدة" : "مسودة دراسة"}</span></div>
<p class="sub">دراسة إلكترونية · ${AUD[sv.audience] || ""} · ${esc(A.C.schoolName)}${r.approved_at ? " · اعتُمدت " + fmt(r.approved_at) : ""}</p>
<div class="grid"><div class="stat"><b>${sn.participants}</b><span>مشاركاً</span></div><div class="stat"><b>${sn.rate_pct != null ? sn.rate_pct + "%" : "—"}</b><span>نسبة المشاركة</span></div><div class="stat"><b>${sn.overall_mean ?? "—"}</b><span>المتوسط العام من 4</span></div><div class="stat"><b style="font-size:1rem">${esc(sn.level)}</b><span>المستوى العام</span></div></div>
${r.note ? `<h3 class="sec">ملخص الدراسة</h3><div class="card"><p>${esc(r.note).replace(/\n/g, "<br>")}</p></div>` : ""}
<h3 class="sec">النتائج حسب المحور</h3><div class="card">${sn.domains.map((d) => bar(d.name, d.mean * 25, d.mean + " من 4")).join("")}</div>
<div class="two"><div><h3 class="sec">نقاط القوة</h3><div class="card">${list(sn.strengths, (x) => `<li>${esc(x.text || x.prompt)} <b>(${x.mean})</b><div class="hint">${esc(x.domain)}</div></li>`)}</div></div>
<div><h3 class="sec">فرص التحسين</h3><div class="card">${list(sn.gaps, (x) => `<li>${esc(x.prompt)} <b>(${x.mean})</b><div class="hint">${esc(x.domain)}</div></li>`)}</div></div></div>
<h3 class="sec">التوصيات</h3>${r.recommendations.map((x, i) => `<div class="item"><div class="row2"><b>${i + 1}. ${esc(x.text)}</b><span class="badge ${x.priority === "عالية" ? "bad" : x.priority === "متوسطة" ? "warn" : "info"}">${esc(x.priority)}</span></div><div class="hint">${esc(x.basis || "")}</div></div>`).join("")}
<h3 class="sec">النتائج التفصيلية</h3>${sn.items.map(item).join("")}
<p class="hint">التحليل وصفي قائم على قواعد ثابتة (قوة عند متوسط 3.3 فأعلى من 4، ومتابعة تحت 2.8)، وهو أداة مساندة لقرار الإدارة ولا يُعدّ تقويماً لأداء أحد.</p>
<p class="mt acts"><button class="btn" id="pr">طباعة / حفظ PDF</button><a class="btn sec" href="${r.can_manage ? "studies-admin.html" : "dashboard.html"}">رجوع</a></p>`;
$("#pr").onclick = () => window.print(); })();
</script></body></html>
