<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>الدراسة – أثر</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet"><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="assets/core.css"><link rel="stylesheet" href="assets/athar.css"></head>
<body><div id="hdr"></div><main class="wrap" id="app"><div class="empty"><span class="spin"></span></div></main><div id="ftr"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><script src="assets/config.js"></script><script src="assets/ub.js"></script><script src="assets/role-switch.js"></script><script src="assets/unified-kit.js"></script><script src="assets/app.js"></script><script src="assets/charts.js"></script><script src="assets/study-doc.js"></script>
<script>
(async () => { if (!(await A.guard("study.html"))) return; const { esc, rpc, $, fmt, msg } = A;
const AUD = { student: "المتعلم", teacher: "المعلم", administrative: "الهيئة الإدارية", supervisor: "الجهة المشرفة", parent: "ولي الأمر" };
const id = new URLSearchParams(location.search).get("id"); let dom = "all", timer = null, texts = null, lastAt = null, rel = null, view = (() => { const v = new URLSearchParams(location.search).get("v"); return ["doc", "res", "exec"].includes(v) ? v : "exec"; })();
const fail = (x) => { $("#app").innerHTML = `<div class="alert bad">${esc(msg(x))}</div><p><a class="btn sec" href="dashboard.html">العودة إلى مكتبي الإلكتروني</a></p>`; };
async function fetchStudy(refresh) {   // المدير يرى مسودة حية: نحدّثها من الإجابات الحالية قبل العرض
  let r = await rpc("study_get", { p_id: id });
  if (r.can_manage && r.status === "draft" && (refresh || !r.snapshot.items)) { try { await rpc("admin_generate_study", { p_survey: r.survey_id, p_scope: r.scope, p_round: r.round }); r = await rpc("study_get", { p_id: id }); } catch (_) {} }
  if (r.can_manage && r.snapshot.items) { try { const t = await rpc("survey_results", { p_id: r.survey_id }); texts = t.texts_hidden ? { hidden: true, min: t.min } : Object.fromEntries(t.items.filter((x) => x.kind === "text").map((x) => [x.id, x.texts || []])); } catch (_) {} }
  try { rel = await rpc("study_reliability", { p_id: id }); } catch (_) { rel = null; }
  lastAt = new Date(); return r; }
/* الدراسة التفصيلية: عرض على الشاشة بالهوية الموحدة، وطباعة عبر ReportKit (ترويسة وتذييل ورمز تحقق في كل صفحة) */
const SDCSS = ".sd-fn{font-size:11px;color:#5b7a8a;margin:2px 0 8px}.sd-cap{font-weight:800;color:#0c6f82;margin:8px 0 2px}.sd-l{margin:4px 0 8px;padding-inline-start:22px}.sd-l li{margin:2px 0}#rkRoot .rk-body .sd-t td.fq small{display:block;font-size:9.5px;color:#71859a}#rkRoot .rk-body .sd-t tr.sum td{background:#f4fafb;font-weight:800}#rkRoot .rk-body .sd-items td,#rkRoot .rk-body .sd-items th{padding:4px 5px;font-size:11.5px}#rkRoot .rk-body .sd-kv td:first-child{width:62%}";
const EXCSS = "#rkRoot .rk-body .ex-msg{border:1px solid #c9dbe1;border-radius:10px;padding:8px 12px;margin:0 0 10px;background:#fbfdfd;box-shadow:inset -4px 0 0 #f0b34a;font-size:13px;line-height:1.8}"
  + ".ex-k{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 6px}.ex-k>div{border:1px solid #c9dbe1;border-radius:10px;padding:8px 6px;text-align:center;background:linear-gradient(180deg,#f4fbfc,#fff)}.ex-k b{display:block;font-size:22px;line-height:1.2;color:#0c6f82}.ex-k span{font-size:10.5px;color:#5b7a8a;line-height:1.4;display:block}"
  + ".ex-d{display:grid;gap:6px;margin:4px 0 6px}.ex-d>div{display:grid;grid-template-columns:42% 1fr 40px 74px;align-items:center;gap:8px;font-size:12px}.ex-d .br{height:10px;background:#e8f1f3;border-radius:6px;overflow:hidden;display:flex}.ex-d .br i{display:block;height:100%;border-radius:6px;margin-left:auto}.ex-d b{color:#0d2b45;text-align:left}.ex-d em{font-style:normal;font-size:11px;color:#5b7a8a}"
  + ".ex-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}.ex-2>div{border-radius:10px;padding:8px 12px;border:1px solid #c9dbe1}.ex-2 .ok{background:#f1faf5;border-color:#bfe3cf}.ex-2 .bad{background:#fff7f0;border-color:#f0d3b4}.ex-2 h4{margin:0 0 4px;font-size:13px;color:#0d2b45}.ex-2 ul{margin:0;padding-inline-start:18px;font-size:12px;line-height:1.7}.ex-2 b{color:#0c6f82;margin-inline-start:4px}"
  + ".ex-r{margin:2px 0 8px;padding-inline-start:20px;font-size:12px;line-height:1.75}.ex-r .pr{display:inline-block;font-size:10px;font-weight:800;color:#8a6200;background:#fff0cc;border-radius:99px;padding:0 8px;margin-inline-end:6px}.ex-n{font-size:10.5px;color:#71859a;border-top:1px dashed #c9dbe1;padding-top:6px;margin-top:6px}";
const printDoc = (r, kind) => { const ex = kind === "exec", body = ex ? SD.exec(r, rel, { esc, schoolName: A.C.schoolName }) : SD.build(r, rel, { esc, schoolName: A.C.schoolName }), sv = r.snapshot.survey || {};
  if (!window.ReportKit || !ReportKit.print) { view = ex ? "exec" : "doc"; paint(r); return window.print(); }
  ReportKit.print({ sb: A.sb, system: "athar", systemName: "أثر", flow: !ex, title: ex ? "الملخص التنفيذي" : "دراسة قياس الأثر", sub: sv.title || "", kicker: "أثر · قياس الأثر · " + A.C.schoolName, body, styles: SDCSS + EXCSS, fname: (ex ? "ملخص تنفيذي – " : "دراسة – ") + (sv.title || "أثر") }); };
const item = (x, i, names) => { const d = names[x.domain] || ""; let h = `<div class="qx"><h4><span class="qn">${i + 1}</span><span>${esc(x.prompt)}<small class="hint" style="display:block">${esc(d)}</small></span>${x.kind === "scale" ? `<span class="m" style="background:${CH.tone(x.mean)}">${x.mean ?? "—"}</span>` : ""}</h4>`;
  if (x.kind === "scale") h += CH.stack(x.dist.slice(0, 4), x.options, x.answered) + `<p class="hint">أجاب ${x.answered} · موافقون ${x.favorable_pct ?? 0}% · غير موافقين ${x.unfavorable_pct ?? 0}%</p>`;
  else if (x.kind === "choice") h += CH.donut(x.options || []);
  else { const t = texts && !texts.hidden ? texts[x.id] : null; h += `<p class="hint">${x.answered} إجابة نصية.${t ? "" : texts && texts.hidden ? ` تظهر نصوصها بعد أن يبلغ المشاركون ${texts.min} حمايةً للخصوصية.` : " لا تُعرض في التقرير حمايةً للخصوصية."}</p>${t && t.length ? `<div class="tx">${t.map((z) => `<div>${esc(z)}</div>`).join("")}</div>` : ""}`; }
  return h + "</div>"; };
const list = (a, f) => a.length ? `<ul>${a.map(f).join("")}</ul>` : '<p class="hint">لا يوجد بعد.</p>';
function paint(r) { const sn = r.snapshot, mg = r.can_manage;
  if (!sn.items) { $("#app").innerHTML = '<div class="empty"><span class="spin"></span></div>'; return; }
  const sv = sn.survey, live = !!sn.live, names = Object.fromEntries(sn.domains.map((d) => [d.code, d.name])), scale = sn.items.filter((x) => x.kind === "scale"), n = sn.participants, tg = sn.target;
  const shown = sn.items.filter((x) => dom === "all" || x.domain === dom), rank = [...scale].filter((x) => x.mean != null).sort((a, b) => b.mean - a.mean);
  const fav = scale.reduce((a, x) => a + (x.dist ? x.dist[2] + x.dist[3] : 0), 0), allv = scale.reduce((a, x) => a + (x.answered || 0), 0);
  const tabs = `<div class="vtabs" role="tablist" aria-label="عرض الدراسة"><button role="tab" data-v="exec" aria-selected="${view === "exec"}" class="${view === "exec" ? "on" : ""}">الملخص التنفيذي</button><button role="tab" data-v="res" aria-selected="${view === "res"}" class="${view === "res" ? "on" : ""}">ملخص النتائج</button><button role="tab" data-v="doc" aria-selected="${view === "doc"}" class="${view === "doc" ? "on" : ""}">الدراسة التفصيلية</button></div>`;
  if (view === "doc" || view === "exec") { const D = new Date(), ex = view === "exec";
    $("#app").innerHTML = `<div class="row2"><h2>${esc(sv.title)}</h2><span class="badge ${r.status === "approved" ? "ok" : "warn"}">${r.status === "approved" ? "دراسة معتمدة" : "مسودة دراسة"}</span></div>${tabs}
    <p class="mt acts"><button class="btn" id="pd">${ex ? "طباعة الملخص التنفيذي / حفظ PDF" : "طباعة الدراسة التفصيلية / حفظ PDF"}</button><a class="btn sec" href="${mg ? "studies-admin.html" : "dashboard.html"}">رجوع</a></p>
    <article class="sd${ex ? " sd-ex" : ""}">
      <header class="sd-uh"><div class="k"><b>المملكة العربية السعودية</b><b>وزارة التعليم</b><span>الإدارة العامة للتعليم بمحافظة الأحساء</span><span>مدرسة لبيد بن ربيعة المتوسطة</span></div>
        <div class="c"><span class="core"><img src="https://i3zalmadeni.github.io/digital-core/assets/core-logo.svg" alt=""><span><b>النواة الرقمية</b><small>الهوية الموحدة</small></span></span><i class="sep"></i><img class="moe" src="https://i3zalmadeni.github.io/digital-core/assets/moe-logo.png" alt="وزارة التعليم"></div>
        <div class="m"><div><span>التاريخ:</span><b>${esc(D.toLocaleDateString("ar-SA-u-ca-gregory-nu-latn", { year: "numeric", month: "long", day: "numeric" }))}</b></div><div><span>رقم التقرير:</span><b>يُصدر عند الطباعة</b></div></div></header>
      <div class="sd-bar" aria-hidden="true"><i></i><i></i><i></i></div>
      <div class="sd-ttl"><span class="k">أثر · قياس الأثر · ${esc(A.C.schoolName)}</span><h1>${ex ? "الملخص التنفيذي" : "دراسة قياس الأثر"}</h1><p class="e">${esc(sv.title)}</p></div>
      <div class="sd-body">${ex ? SD.exec(r, rel, { esc, schoolName: A.C.schoolName }) : SD.build(r, rel, { esc, schoolName: A.C.schoolName })}</div>
      <div class="sd-bar" aria-hidden="true"><i></i><i></i><i></i></div><p class="sd-foot">صدر هذا التقرير من «أثر» · أحد أنظمة النواة الرقمية · ${esc(A.C.schoolName)}</p>
    </article>`;
    document.querySelectorAll("[data-v]").forEach((b) => b.onclick = () => { view = b.dataset.v; paint(r); });
    $("#pd").onclick = () => printDoc(r, view); return; }
  $("#app").innerHTML = `<div class="row2"><h2>${esc(sv.title)}</h2><span class="badge ${r.status === "approved" ? "ok" : "warn"}">${r.status === "approved" ? "دراسة معتمدة" : live ? "مسودة دراسة · جارية" : "مسودة دراسة · مكتملة"}</span></div>
  <p class="sub">${r.scope === "cumulative" ? `تقرير تراكمي (الجولات 1 إلى ${r.round})` : r.survey_round > 1 || r.round > 1 ? `تقرير الجولة ${r.round}` : "دراسة إلكترونية"} · ${AUD[sv.audience] || ""} · ${esc(A.C.schoolName)}${r.approved_at ? " · اعتُمدت " + fmt(r.approved_at) : ""}</p>
  ${tabs}
  ${mg && r.siblings.length > 1 ? `<div class="dtabs" aria-label="تقارير هذه الاستبانة">${r.siblings.map((z) => `<button data-s="${z.id}" class="${z.id === r.id ? "on" : ""}">${z.scope === "cumulative" ? "تراكمي حتى الجولة " + z.round : "الجولة " + z.round}${z.status === "approved" ? " · معتمد" : ""}</button>`).join("")}</div>` : ""}
  ${mg && r.survey_round > 1 ? `<div class="livebar off" style="flex-wrap:wrap"><b>إصدار تقرير</b><span class="hint">للاستبانة ${r.survey_round} جولات.</span><button class="btn sm sec" data-g="round">تقرير جديد: الجولة ${r.survey_round} وحدها</button><button class="btn sm sec" data-g="cumulative">تقرير تراكمي: كل الجولات</button></div>` : ""}
  ${mg && r.status === "draft" ? `<div class="livebar ${live ? "" : "off"}"><span class="dot"></span><b>${live ? "نتائج حية" : "اكتمل جمع الإجابات"}</b><span class="hint">${live ? "تتحدث الأرقام تلقائياً كل 20 ثانية" + (tg ? ` وتُغلق الاستبانة تلقائياً عند بلوغ ${tg} مشاركاً` : "") : "أُغلقت الاستبانة. راجع الدراسة ثم اعتمدها من إدارة الدراسات"}</span><span class="hint" style="margin-inline-start:auto">آخر تحديث ${lastAt.toLocaleTimeString("ar-SA-u-ca-gregory-nu-latn", { hour: "2-digit", minute: "2-digit", second: "2-digit" })}</span><button class="btn sm sec" id="rf">تحديث الآن</button></div>` : ""}
  <div class="kp"><div>${CH.gauge(sn.overall_mean)}<b>${esc(sn.level)}</b><small>المتوسط العام</small></div><div>${CH.ring(n, tg || sn.eligible, tg || sn.eligible ? "من " + (tg || sn.eligible) : "مشاركاً")}<b>${n} مشاركاً</b><small>${tg ? "الهدف " + tg : sn.eligible ? "من " + sn.eligible + " مؤهلاً" : "بلا عدد مستهدف"}</small></div>
    <div>${CH.ring(fav, allv, "إيجابية")}<b>${allv ? Math.round(100 * fav / allv) + "%" : "—"}</b><small>إجابات إيجابية (٣ و٤)</small></div></div>
  ${r.note ? `<h3 class="sec">ملخص الدراسة</h3><div class="card"><p>${esc(r.note).replace(/\n/g, "<br>")}</p></div>` : ""}
  <div class="two"><div><h3 class="sec">النتائج حسب المحور</h3><div class="card">${sn.domains.length ? CH.radar(sn.domains) + CH.bars(sn.domains.map((d) => [d.name, d.mean, d.mean + " من 4"]), 4) : '<p class="hint">لا بيانات بعد.</p>'}</div></div>
  <div><h3 class="sec">ترتيب العبارات بالمتوسط</h3><div class="card" style="max-height:440px;overflow:auto">${rank.length ? CH.bars(rank.map((x) => [x.prompt, x.mean, String(x.mean)]), 4) : '<p class="hint">لا بيانات بعد.</p>'}</div></div></div>
  <div class="two"><div><h3 class="sec">نقاط القوة</h3><div class="card">${list(sn.strengths, (x) => `<li>${esc(x.text || x.prompt)} <b>(${x.mean})</b><div class="hint">${esc(x.domain)}</div></li>`)}</div></div>
  <div><h3 class="sec">فرص التحسين</h3><div class="card">${list(sn.gaps, (x) => `<li>${esc(x.prompt)} <b>(${x.mean})</b><div class="hint">${esc(x.domain)}</div></li>`)}</div></div></div>
  <h3 class="sec">التوصيات</h3>${r.recommendations.map((x, i) => `<div class="item"><div class="row2"><b>${i + 1}. ${esc(x.text)}</b><span class="badge ${x.priority === "عالية" ? "bad" : x.priority === "متوسطة" ? "warn" : "info"}">${esc(x.priority)}</span></div><div class="hint">${esc(x.basis || "")}</div></div>`).join("")}
  <h3 class="sec">النتائج التفصيلية</h3><div class="dtabs">${[["all", "كل العبارات"], ...sn.domains.map((d) => [d.code, d.name])].map(([k, t]) => `<button data-d="${k}" class="${dom === k ? "on" : ""}">${esc(t)}</button>`).join("")}</div>
  ${shown.map((x, i) => item(x, sn.items.indexOf(x), names)).join("") || '<p class="hint">لا عبارات.</p>'}
  <p class="hint">التحليل وصفي قائم على قواعد ثابتة (قوة عند متوسط 3.3 فأعلى من 4، ومتابعة تحت 2.8)، وهو أداة مساندة لقرار الإدارة ولا يُعدّ تقويماً لأداء أحد.</p>
  <p class="mt acts"><button class="btn" id="pr2">طباعة الدراسة التفصيلية</button><button class="btn sec" id="pr">طباعة ملخص النتائج</button><a class="btn sec" href="${mg ? "studies-admin.html" : "dashboard.html"}">رجوع</a></p>`;
  document.querySelectorAll("[data-s]").forEach((b) => b.onclick = () => { location.href = "study.html?id=" + b.dataset.s; });
  document.querySelectorAll("[data-g]").forEach((b) => b.onclick = async () => { b.disabled = true; try { const sid = await rpc("admin_generate_study", { p_survey: r.survey_id, p_scope: b.dataset.g }); location.href = "study.html?id=" + sid; } catch (x) { b.disabled = false; alert(msg(x)); } });
  document.querySelectorAll("[data-d]").forEach((b) => b.onclick = () => { dom = b.dataset.d; paint(r); });
  document.querySelectorAll("[data-v]").forEach((b) => b.onclick = () => { view = b.dataset.v; paint(r); });
  $("#pr").onclick = () => window.print(); $("#pr2").onclick = () => printDoc(r, "doc"); const rf = $("#rf"); if (rf) rf.onclick = () => tick(true); }
let cur = null;
async function tick(now) { try { cur = await fetchStudy(true); paint(cur); } catch (x) { if (!cur) fail(x); } schedule(); }
function schedule() { clearTimeout(timer); if (cur && cur.can_manage && cur.status === "draft" && cur.snapshot.live && !document.hidden) timer = setTimeout(tick, 20000); }
document.addEventListener("visibilitychange", () => { if (!document.hidden && cur && cur.snapshot.live) tick(); });
try { cur = await fetchStudy(false); paint(cur); schedule(); } catch (x) { fail(x); }
})();
</script><script src="https://i3zalmadeni.github.io/digital-core/assets/report-kit.js?v=20261120e"></script><script>window.ReportKit&&ReportKit.install({system:"athar",systemName:"أثر",root:["#app","#main","main"]});</script></body></html>
