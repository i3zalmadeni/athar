<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>الاستبانة – أثر</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet"><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="assets/core.css"><link rel="stylesheet" href="assets/athar.css"></head>
<body><div id="hdr"></div><main class="wrap" id="app"><div class="empty"><span class="spin"></span></div></main><div id="ftr"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><script src="assets/config.js"></script><script src="assets/ub.js"></script><script src="assets/unified-kit.js"></script><script src="assets/app.js"></script><script src="assets/survey-ui.js"></script>
<script>
(async () => { if (!(await A.guard("survey.html"))) return; const { esc, rpc, $, fmt, msg, toast } = A;
const id = new URLSearchParams(location.search).get("id");
let s; try { s = await rpc("survey_get", { p_id: id }); } catch (x) { $("#app").innerHTML = `<div class="alert bad">${esc(msg(x))}</div><p><a class="btn sec" href="dashboard.html">العودة إلى مكتبي الإلكتروني</a></p>`; return; }
const aud = s.audience || "teacher";
SV.render($("#app"), { ...s, audience: aud }, { school: A.C.schoolName, contact: false, preview: s.status !== "open",
  submit: async (ans) => { await rpc("survey_submit", { p_id: s.id, p_answers: ans }); },
  after: '<p style="margin-top:18px"><a class="btn sec" href="dashboard.html">العودة إلى مكتبي الإلكتروني</a></p>' });
})();
</script></body></html>
